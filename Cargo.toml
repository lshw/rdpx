[package]
name = "rdpx"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
ironrdp-acceptor = "=0.10.0"
ironrdp-pdu = "=0.9.0"
ironrdp-tokio = { version = "=0.10.0", features = ["reqwest"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
x509-cert = "0.2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
